apiVersion: apps/v1
kind: Deployment
metadata:
  name: nasa-dashboard
  labels:
    app: nasa-dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: nasa-dashboard
  template:
    metadata:
      labels:
        app: nasa-dashboard
    spec:
      # Intentionally vulnerable-by-design (Black Duck IaC scan target) —
      # hostNetwork/hostPath + privileged escape the pod sandbox entirely,
      # and the hardcoded key mirrors src/secrets/hardcoded_secret.py.
      automountServiceAccountToken: true
      containers:
        - name: nasa-dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
          env:
            - name: NASA_API_KEY
              value: {{ .Values.nasaApiKey | quote }}
          securityContext:
            privileged: false
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
